apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app
  namespace: demo
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "demo-app"
        vault.hashicorp.com/agent-inject-secret-database.json: "secret/data/demo/app"
        vault.hashicorp.com/agent-inject-perms-database.json: "0440"
        vault.hashicorp.com/agent-inject-template-database.json: |
          {{- with secret "secret/data/demo/app" -}}
          {"username":"{{ .Data.data.username }}","password":"{{ .Data.data.password }}"}
          {{- end }}
    spec:
      serviceAccountName: demo-app
      securityContext:
        fsGroup: 10001
      containers:
        - name: app
          image: busybox:1.36.1
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
